name: build

# Builds tbyool/android_kernel_xiaomi_sm6150 (branch ksu-next) for Redmi Note 10 Pro
# (sweet/sweetin) and publishes an AnyKernel3 zip as a GitHub Release. Nothing is
# uploaded as an Actions artifact (avoids the artifact storage quota problem).
#
# Root solution: Baka-SU/BakaSU (KernelSU downstream, formerly ReSukiSU) in MANUAL HOOK mode,
# cloned at build time and wired in as drivers/kernelsu, plus NoMount (maxsteeel/nomount) integrated
# into the kernel source with its setup.sh. SUSFS is optional (manual run, enable_susfs): BakaSU's
# "SUSFS Inline Hook" mode + the 4.14 non-GKI SUSFS backport from JackA1ltman/NonGKI_Kernel_Build_2nd.
# The kernel tree's existing manual hooks (fs/exec.c, fs/open.c, ...) are used as they are, and
# BakaSU checks at compile time that every required hook exists: if one is missing the build log
# names it (see https://bakasu.org/guide/manual-integrate).
#
# Put this file at .github/workflows/build.yml in the ksu-next branch. Every push to
# ksu-next starts a build. The manual "Run workflow" button only shows up if the file is
# also on the repository's default branch (or ksu-next is set as the default branch).

on:
  push:
    branches: [ksu-next]
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "Baka-SU/BakaSU ref: 'latest' = tip of main, or type a tag/branch/commit (e.g. v4.2.0-rc3)"
        type: string
        default: latest
      nomount_ref:
        description: "maxsteeel/nomount branch used for the kernel side (master = stable, dev = nightly). Install the matching NoMount module after flashing."
        type: string
        default: master
      disable_lto:
        description: "Build WITHOUT LTO (faster; use to debug a failing/boot-looping build)"
        type: boolean
        default: false
      enable_susfs:
        description: "EXPERIMENTAL: build BakaSU with SUSFS (SUSFS Inline Hook mode instead of Manual Hook). Off = BakaSU manual hooks + NoMount"
        type: boolean
        default: false
      susfs_ref:
        description: "JackA1ltman/NonGKI_Kernel_Build_2nd ref that carries the 4.14 SUSFS patch (default = pinned commit, SUSFS v2.4.0)"
        type: string
        default: ec069a4e34f992d602a6b40d2e211df2516e2865

permissions:
  contents: write

env:
  DEFCONFIG: sweet_defconfig
  ARCH: arm64
  # AOSP Clang 21.0.0 r563880c (same toolchain as the stock Spiteful kernel), pinned commit
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/f8439f0628d799092dd07df440a6334cab28939c/clang-r563880c.tar.gz
  CLANG_ID: r563880c
  KBUILD_BUILD_USER: PsychoAvy
  KBUILD_BUILD_HOST: github
  # SUSFS is OFF for push builds (BakaSU manual hooks + NoMount); it is only built when a manual
  # run ticks enable_susfs, which switches BakaSU to its SUSFS Inline Hook mode
  ENABLE_SUSFS: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_susfs }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch KernelSU
        env:
          IN_KSU_REF: ${{ inputs.ksu_ref }}
        run: |
          set -e
          REF="${IN_KSU_REF:-latest}"
          KSU_REPO="Baka-SU/BakaSU"
          # keep this a full clone: BakaSU's Kbuild derives its version from git history
          git clone --quiet "https://github.com/${KSU_REPO}" KernelSU
          echo "---- branches ----"
          git -C KernelSU branch -r | head -20
          if [ "$REF" != "latest" ]; then
            git -C KernelSU rev-parse -q --verify "${REF}^{commit}" >/dev/null || git -C KernelSU rev-parse -q --verify "origin/${REF}^{commit}" >/dev/null || { echo "::error::ref '$REF' not found in ${KSU_REPO} (see the branch list above)"; exit 1; }
            git -C KernelSU checkout -q "$REF" 2>/dev/null || git -C KernelSU checkout -q "origin/$REF"
          fi
          SHORT="$(git -C KernelSU rev-parse --short HEAD)"
          DESC="$(git -C KernelSU describe --tags --always)"
          COUNT="$(git -C KernelSU rev-list --count HEAD)"
          echo "${KSU_REPO} @ $SHORT ($DESC), $COUNT commits"
          test -f KernelSU/kernel/Kconfig || { echo "::error::KernelSU/kernel/Kconfig not found"; ls -la KernelSU; exit 1; }
          # point drivers/kernelsu at the fork (the kernel tree already sources drivers/kernelsu)
          rm -rf drivers/kernelsu
          ln -s ../KernelSU/kernel drivers/kernelsu
          ls -la drivers/kernelsu
          echo "---- Kconfig of the fork (config names, dependencies, defaults) ----"
          grep -nE "^[[:space:]]*(menu)?config |depends on|default|select|prompt|bool|tristate" KernelSU/kernel/Kconfig | head -80
          if [ "$ENABLE_SUSFS" = "true" ]; then
            echo "VARIANT=bakasu-susfs" >> "$GITHUB_ENV"
            echo "VARIANT_NAME=BakaSU ${DESC} + SUSFS" >> "$GITHUB_ENV"
            echo "SLUG=bakasu-susfs" >> "$GITHUB_ENV"
          else
            echo "VARIANT=bakasu" >> "$GITHUB_ENV"
            echo "VARIANT_NAME=BakaSU ${DESC}" >> "$GITHUB_ENV"
            echo "SLUG=bakasu" >> "$GITHUB_ENV"
          fi
          echo "KSU_DESC=${KSU_REPO} @ ${SHORT} (${DESC})" >> "$GITHUB_ENV"

      - name: Integrate NoMount into the kernel
        env:
          IN_NM_REF: ${{ inputs.nomount_ref }}
        run: |
          set -e
          NM_REF="${IN_NM_REF:-master}"
          # raw.githubusercontent.com accepts a branch, a tag or a commit SHA here
          curl -fsSL "https://raw.githubusercontent.com/maxsteeel/nomount/${NM_REF}/kernel/setup.sh" -o /tmp/nm_setup.sh \
            || { echo "::error::could not download kernel/setup.sh for ref '${NM_REF}' of maxsteeel/nomount (not a branch, tag or commit?)"; exit 1; }
          echo "---- setup.sh (first 60 lines) ----"
          head -60 /tmp/nm_setup.sh
          echo "---- running it at the kernel tree root ----"
          bash /tmp/nm_setup.sh "$NM_REF"
          # setup.sh only creates the fs/nomount -> NoMount/kernel/src link when fs/nomount does not exist
          # yet. This kernel tree already ships a vendored (older) fs/nomount directory, so the link ended
          # up inside it as fs/nomount/src and the OLD vendored code kept being compiled (driver stayed 22
          # whatever nomount_ref was). Replace the vendored copy with the freshly fetched sources.
          if [ ! -L fs/nomount ]; then
            echo "fs/nomount is a vendored directory: replacing it with a link to NoMount/kernel/src"
            ls -la fs/nomount/ || true
            rm -rf fs/nomount
            ln -s ../NoMount/kernel/src fs/nomount
          fi
          test -d fs/nomount || { echo "::error::fs/nomount was not created by setup.sh"; git status --short | head -30; exit 1; }
          ls -la fs/nomount fs/nomount/
          grep -n "nomount" fs/Kconfig fs/Makefile || true
          echo "---- fs/nomount/Kconfig ----"
          cat fs/nomount/Kconfig 2>/dev/null | head -40 || true
          NM_SHA="$(git -C NoMount rev-parse --short HEAD 2>/dev/null || echo '?')"
          NM_CNT="$(git -C NoMount rev-list --count HEAD 2>/dev/null || echo '?')"
          NM_VER="$(grep -rhoE 'NOMOUNT_BASE_VERSION[[:space:]]+"?[0-9]+"?' fs/nomount/ 2>/dev/null | head -1 || true)"
          echo "NoMount: ref=${NM_REF} sha=${NM_SHA} commits=${NM_CNT} ${NM_VER}"
          echo "NM_DESC=maxsteeel/nomount ${NM_REF} @ ${NM_SHA} (${NM_CNT} commits)" >> "$GITHUB_ENV"
          # Diagnostic: which branch/tag of maxsteeel/nomount carries which NOMOUNT_BASE_VERSION
          echo "---- NoMount NOMOUNT_BASE_VERSION per branch/tag ----"
          git -C NoMount fetch --quiet --tags origin '+refs/heads/*:refs/remotes/origin/*' 2>/dev/null || true
          for r in $(git -C NoMount for-each-ref --format='%(refname:short)' refs/remotes/origin refs/tags | grep -v '/HEAD$'); do
            v="$(git -C NoMount grep -h -o -E 'NOMOUNT_BASE_VERSION[[:space:]]+"?[0-9]+"?' "$r" -- kernel 2>/dev/null | head -1 || true)"
            c="$(git -C NoMount rev-list --count "$r" 2>/dev/null || echo '?')"
            echo "$r  commits=$c  ${v:-n/a}"
          done || true
          echo "---- end ----"

      # The kernel tree was prepared for KernelSU-Next (legacy). BakaSU uses the "scope-minimized
      # manual hooks" layout (adapted from backslashxx/KernelSU#5), which differs in a few places:
      #  1. The old read / input / setuid hooks (ksu_vfs_read_hook, ksu_input_hook, ksu_handle_setresuid)
      #     are not provided by BakaSU: on kernels < 6.8 it applies them itself (LSM / input handler)
      #     when CONFIG_KSU_MANUAL_HOOK_AUTO_{INITRC,INPUT,SETUID}_HOOK are on (set in "Configure kernel").
      #     The legacy blocks are stripped from the tree so they cannot clash; weak stubs for the two
      #     read symbols stay as a safety net so the link succeeds either way.
      #  2. fs/stat.c needs the newfstat return hook, otherwise init never sees the enlarged init.rc
      #     (required on Android 16+, harmless on older), plus the fstat64 return hook (32-bit su): BakaSU's
      #     compile-time check fails the build without it.
      - name: Adapt manual hooks for BakaSU
        if: env.ENABLE_SUSFS != 'true'
        run: |
          set -e
          cat > fs/ksu_hook_stubs.c <<'EOF'
          // SPDX-License-Identifier: GPL-2.0
          /* Weak, inert stubs for the old KernelSU-Next read hook that fs/read_write.c may still reference. */
          #include <linux/types.h>
          #include <linux/compiler.h>
          #include <linux/cache.h>
          #include <linux/uaccess.h>

          bool ksu_vfs_read_hook __read_mostly __weak = false;

          int __weak ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr)
          {
          	return 0;
          }
          EOF
          grep -q "ksu_hook_stubs" fs/Makefile || echo 'obj-$(CONFIG_KSU) += ksu_hook_stubs.o' >> fs/Makefile
          python3 - <<'PY2'
          import re, pathlib

          # legacy KernelSU-Next hooks that BakaSU replaces with its own automatic (LSM / input handler) hooks
          TARGETS = {
              "fs/read_write.c": ("ksu_vfs_read_hook", "ksu_handle_sys_read", "ksu_handle_vfs_read"),
              "drivers/input/input.c": ("ksu_input_hook", "ksu_handle_input_handle_event"),
              "kernel/sys.c": ("ksu_handle_setresuid",),
          }

          def strip_legacy(path, names):
              p = pathlib.Path(path)
              if not p.exists():
                  print(path + ": not found, skipped")
                  return
              lines = p.read_text().splitlines(keepends=True)
              out, i, removed = [], 0, 0
              while i < len(lines):
                  s = lines[i].lstrip()
                  # only plain '#ifdef CONFIG_KSU' style guards; BakaSU-style CONFIG_KSU_MANUAL_HOOK blocks stay
                  if re.match(r"#\s*if", s) and "CONFIG_KSU" in s and "CONFIG_KSU_MANUAL_HOOK" not in s:
                      depth, j, has_else = 0, i, False
                      while j < len(lines):
                          t = lines[j].lstrip()
                          if re.match(r"#\s*if", t):
                              depth += 1
                          elif re.match(r"#\s*el", t) and depth == 1:
                              has_else = True
                          elif re.match(r"#\s*endif", t):
                              depth -= 1
                              if depth == 0:
                                  break
                          j += 1
                      block = "".join(lines[i:j + 1])
                      if j < len(lines) and not has_else and any(n in block for n in names):
                          removed += 1
                          i = j + 1
                          continue
                  out.append(lines[i])
                  i += 1
              if removed:
                  p.write_text("".join(out))
              print("%s: removed %d legacy KSU block(s)" % (path, removed))

          for f, names in TARGETS.items():
              strip_legacy(f, names)
          PY2
          python3 - <<'PY'
          import re, sys, pathlib
          p = pathlib.Path("fs/stat.c")
          text = p.read_text()

          def add_ret_hook(text, syscall, fn, decl, call):
              if fn in text:
                  print("fs/stat.c: %s already present" % fn)
                  return text
              m = re.search(r"^SYSCALL_DEFINE2\(%s,.*?^\}\n" % syscall, text, re.S | re.M)
              if not m:
                  print("::warning::SYSCALL_DEFINE2(%s) not found in fs/stat.c" % syscall)
                  return text
              body = m.group(0)
              if "\treturn error;\n}" not in body:
                  sys.exit("unexpected %s body:\n%s" % (syscall, body))
              new = body.replace("\treturn error;\n}",
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n\t" + call + "\n#endif\n\treturn error;\n}", 1)
              pre = "#ifdef CONFIG_KSU_MANUAL_HOOK\n" + decl + "\n#endif\n\n"
              print("fs/stat.c: %s hook added" % fn)
              return text[:m.start()] + pre + new + text[m.end():]

          text = add_ret_hook(text, "newfstat", "ksu_handle_newfstat_ret",
              "extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);",
              "ksu_handle_newfstat_ret(&fd, &statbuf);")
          # 32-bit su (compat): BakaSU's compile-time hook check asks for this one too
          text = add_ret_hook(text, "fstat64", "ksu_handle_fstat64_ret",
              "extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);",
              "ksu_handle_fstat64_ret(&fd, &statbuf);")
          p.write_text(text)
          PY
          git --no-pager diff --stat -- fs/stat.c fs/Makefile fs/read_write.c drivers/input/input.c kernel/sys.c || true
          grep -n -B3 -A3 "ksu_handle_newfstat_ret\|ksu_handle_fstat64_ret" fs/stat.c | head -60
          echo "---- legacy KSU symbols still referenced in the tree (expect none outside the weak stubs) ----"
          grep -rnE "ksu_vfs_read_hook|ksu_input_hook|ksu_handle_input_handle_event|ksu_handle_vfs_read|ksu_handle_setresuid" fs kernel drivers/input include 2>/dev/null | grep -v ksu_hook_stubs || true

      # EXPERIMENTAL. SUSFS for BakaSU on Linux 4.14. simonpunk's own kernel-4.14 patch is far older than what
      # BakaSU's "SUSFS Inline Hook" mode expects, so this uses the non-GKI backport from
      # JackA1ltman/NonGKI_Kernel_Build_2nd (Patches/Patch/susfs_patch_to_4.14.patch, SUSFS v2.4.0) and the
      # flow its wiki describes for BakaSU: clean_hook.sh (strip the old KSU hooks) -> BakaSU ->
      # susfs_inline_hook_patches.sh -> susfs patch. clean_hook.sh also deletes KernelSU/ and drivers/kernelsu,
      # so BakaSU is parked and put back around it. Four hunks of the 4.14 patch do not apply to this tree
      # (kernel/sys.c, fs/proc/task_mmu.c, fs/proc/cmdline.c, fs/stat.c): they are ported by a small script.
      # BakaSU's manual hooks are not used in this mode (KSU_SUSFS replaces KSU_MANUAL_HOOK).
      # If anything else fails the log lists the files found and the rejects.
      - name: Integrate SUSFS (BakaSU inline hooks, experimental)
        if: env.ENABLE_SUSFS == 'true'
        env:
          IN_SUSFS_REF: ${{ inputs.susfs_ref }}
        run: |
          set -e
          REF="${IN_SUSFS_REF:-ec069a4e34f992d602a6b40d2e211df2516e2865}"
          rm -rf /tmp/nongki
          git clone --quiet https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd /tmp/nongki
          git -C /tmp/nongki checkout -q "$REF" || { echo "::error::ref '$REF' not found in JackA1ltman/NonGKI_Kernel_Build_2nd"; exit 1; }
          SUSFS_SHA="$(git -C /tmp/nongki rev-parse --short HEAD)"
          echo "NonGKI_Kernel_Build_2nd @ $SUSFS_SHA"
          echo "---- candidate files ----"
          ( cd /tmp/nongki && find . -path ./.git -prune -o -type f \( -name '*susfs*' -o -name 'clean_hook*' \) -print | sort )
          find1() { find /tmp/nongki -path /tmp/nongki/.git -prune -o -type f -name "$1" -print | head -1; }
          PATCH="$(find1 susfs_patch_to_4.14.patch)"
          HOOKS="$(find1 susfs_inline_hook_patches.sh)"
          CLEAN="$(find1 clean_hook.sh)"
          for f in "$PATCH" "$HOOKS" "$CLEAN"; do
            [ -n "$f" ] || { echo "::error::susfs_patch_to_4.14.patch / susfs_inline_hook_patches.sh / clean_hook.sh not all found in NonGKI_Kernel_Build_2nd @ $SUSFS_SHA (see the list above)"; exit 1; }
          done
          cp "$PATCH" "$HOOKS" "$CLEAN" .
          echo "---- clean_hook.sh (first 40 lines) ----"
          head -40 clean_hook.sh
          echo "---- susfs_inline_hook_patches.sh (first 40 lines) ----"
          head -40 susfs_inline_hook_patches.sh
          echo "---- 1/4: clean_hook.sh (BakaSU parked meanwhile: the script deletes KernelSU/ and drivers/kernelsu) ----"
          rm -rf /tmp/KernelSU_keep
          mv KernelSU /tmp/KernelSU_keep
          rm -f drivers/kernelsu
          bash clean_hook.sh
          rm -rf KernelSU drivers/kernelsu
          mv /tmp/KernelSU_keep KernelSU
          ln -s ../KernelSU/kernel drivers/kernelsu
          ls -la drivers/kernelsu
          echo "---- 2/4: susfs_inline_hook_patches.sh ----"
          bash susfs_inline_hook_patches.sh
          echo "---- 3/4: susfs_patch_to_4.14.patch ----"
          patch -p1 --forward --batch --no-backup-if-mismatch < susfs_patch_to_4.14.patch || true
          echo "---- 4/4: port the hunks that do not apply to this tree ----"
          cat > /tmp/susfs_port.py <<'PY'
          import pathlib, re, sys

          def rd(p): return pathlib.Path(p).read_text()
          def wr(p, t): pathlib.Path(p).write_text(t)
          def rej(p):
              r = pathlib.Path(p + ".rej")
              return r.exists()
          def drop(p): pathlib.Path(p + ".rej").unlink()

          # kernel/sys.c: uname spoof
          p = "kernel/sys.c"
          if rej(p):
              t = rd(p)
              if "susfs_is_uname_spoof_buffer_set" not in t:
                  a = "SYSCALL_DEFINE1(newuname, struct new_utsname __user *, name)\n{"
                  if a not in t: sys.exit("sys.c: newuname not found")
                  t = t.replace(a, "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\nextern struct static_key_false susfs_is_uname_spoof_buffer_set;\nextern void susfs_spoof_uname(struct new_utsname* tmp);\n#endif\n" + a, 1)
                  m = re.search(r"SYSCALL_DEFINE1\(newuname.*?memcpy\(&tmp, utsname\(\), sizeof\(tmp\)\);\n", t, re.S)
                  if not m: sys.exit("sys.c: memcpy in newuname not found")
                  t = t[:m.end()] + "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n\tif (static_branch_likely(&susfs_is_uname_spoof_buffer_set))\n\t\tsusfs_spoof_uname(&tmp);\n#endif\n" + t[m.end():]
                  wr(p, t)
              drop(p); print(p + ": ported")

          # fs/proc/task_mmu.c: susfs_def.h include
          p = "fs/proc/task_mmu.c"
          if rej(p):
              t = rd(p)
              if "susfs_def.h" not in t:
                  blk = "#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux/susfs_def.h>\n#endif\n"
                  for a in ("#include <linux/ctype.h>\n", "#include <linux/uaccess.h>\n"):
                      if a in t:
                          wr(p, t.replace(a, a + blk, 1)); break
                  else:
                      sys.exit("task_mmu.c: no include anchor found")
              drop(p); print(p + ": ported")

          # fs/proc/cmdline.c: cmdline spoof
          p = "fs/proc/cmdline.c"
          if rej(p):
              t = rd(p)
              if "susfs_spoof_cmdline_or_bootconfig" not in t:
                  a = "static int cmdline_proc_show(struct seq_file *m, void *v)\n{\n"
                  if a not in t: sys.exit("cmdline.c: cmdline_proc_show not found")
                  t = t.replace(a,
                      "#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\nextern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;\nextern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);\n#endif\n\n" + a +
                      "#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n\tif (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {\n\t\tsusfs_spoof_cmdline_or_bootconfig(m);\n\t\tseq_putc(m, '\\n');\n\t\treturn 0;\n\t}\n#endif\n", 1)
                  wr(p, t)
              drop(p); print(p + ": ported")

          # fs/stat.c: sus_kstat in vfs_getattr_nosec
          p = "fs/stat.c"
          if rej(p):
              t = rd(p)
              if "STATX_SUS_KSTAT_FUSE" not in t:
                  m = re.search(r"\tif \(inode->i_op->getattr\)\n\t\treturn inode->i_op->getattr\(path, stat, request_mask,\n\s*query_flags\);\n", t)
                  if not m:
                      i = t.find("vfs_getattr_nosec(")
                      print(t[i:i + 1200])
                      sys.exit("stat.c: getattr call in vfs_getattr_nosec not found (function printed above)")
                  new = "\n".join([
          "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT",
          "\tif (susfs_is_current_app_uid()) {",
          "\t\tbool is_fuse = false;",
          "\t\tif (susfs_is_inode_sus_kstat(d_backing_inode(path->dentry), &is_fuse)) {",
          "\t\t\tif (!is_fuse)",
          "\t\t\t\tstat->result_mask |= STATX_SUS_KSTAT;",
          "\t\t\tstat->result_mask |= STATX_SUS_KSTAT_FUSE;",
          "\t\t}",
          "\t}",
          "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT",
          "",
          "\tif (inode->i_op->getattr)",
          "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT",
          "\t{",
          "\t\tint err = inode->i_op->getattr(path, stat, request_mask,",
          "\t\t\t\t\t    query_flags);",
          "\t\tif (!err) {",
          "\t\t\tif (stat->result_mask & STATX_SUS_KSTAT) {",
          "\t\t\t\tsusfs_sus_kstat_spoof_generic_fillattr(inode, stat, STATX_SUS_KSTAT);",
          "\t\t\t\treturn err;",
          "\t\t\t}",
          "\t\t\tif (stat->result_mask & STATX_SUS_KSTAT_FUSE) {",
          "\t\t\t\tsusfs_sus_kstat_spoof_generic_fillattr(inode, stat, STATX_SUS_KSTAT_FUSE);",
          "\t\t\t\treturn err;",
          "\t\t\t}",
          "\t\t}",
          "\t\treturn err;",
          "\t}",
          "\tif (stat->result_mask & STATX_SUS_KSTAT) {",
          "\t\tgeneric_fillattr(inode, stat);",
          "\t\tsusfs_sus_kstat_spoof_generic_fillattr(inode, stat, STATX_SUS_KSTAT);",
          "\t\treturn 0;",
          "\t}",
          "\tif (stat->result_mask & STATX_SUS_KSTAT_FUSE) {",
          "\t\tgeneric_fillattr(inode, stat);",
          "\t\tsusfs_sus_kstat_spoof_generic_fillattr(inode, stat, STATX_SUS_KSTAT_FUSE);",
          "\t\treturn 0;",
          "\t}",
          "#else",
          "\t\treturn inode->i_op->getattr(path, stat, request_mask,",
          "\t\t\t\t\t    query_flags);",
          "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT",
          ""])
                  wr(p, t[:m.start()] + new + t[m.end():])
              drop(p); print(p + ": ported")
          # fs/mount.h has no include guard on 4.14, and fs/stat.c ends up including "mount.h" twice (once from the
          # tree / NoMount, once from the SUSFS patch) -> "redefinition of 'mount'" etc. Guard it once for all users.
          p = "fs/mount.h"
          t = rd(p)
          if "#pragma once" not in t:
              wr(p, "#pragma once\n" + t)
              print(p + ": #pragma once added")
          PY
          python3 /tmp/susfs_port.py
          REJ="$(find . -name '*.rej' -not -path './out/*' -not -path './.git/*')"
          if [ -n "$REJ" ]; then
            echo "::error::SUSFS patch has rejected hunks (they must be ported to this tree)"
            for f in $REJ; do echo "=== $f ==="; cat "$f"; done
            exit 1
          fi
          rm -f clean_hook.sh susfs_inline_hook_patches.sh susfs_patch_to_4.14.patch
          git --no-pager diff --stat | tail -40 || true
          echo "SUSFS_DESC=JackA1ltman/NonGKI_Kernel_Build_2nd @ ${SUSFS_SHA} (susfs_patch_to_4.14.patch)" >> "$GITHUB_ENV"

      - name: Install build dependencies
        timeout-minutes: 25
        run: |
          # The Azure Ubuntu mirror can dribble data at a crawl: the per-file timeout never fires, so a single
          # apt run used to eat the whole step timeout. Cap each attempt (apt resumes partial downloads on
          # the next try) and fall back to archive.ubuntu.com after the second failed attempt.
          APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o DPkg::Lock::Timeout=60)
          PKGS=(bc bison flex libssl-dev libelf-dev cpio zip unzip lz4 xz-utils
                python3 device-tree-compiler make gcc
                gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi)
          apt_update() {
            for i in 1 2 3; do
              sudo timeout 120 apt-get "${APT_OPTS[@]}" update && return 0
              echo "apt update failed (try $i)"; sleep 5
            done
            return 1
          }
          apt_update || true
          ok=0
          for attempt in 1 2 3 4; do
            echo "---- apt install, attempt $attempt ----"
            if sudo timeout 240 apt-get "${APT_OPTS[@]}" install -y --no-install-recommends "${PKGS[@]}"; then
              ok=1; break
            fi
            echo "attempt $attempt failed or stalled"
            if [ "$attempt" -eq 2 ]; then
              echo "---- switching to archive.ubuntu.com ----"
              printf 'http://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              sudo find /etc/apt -name '*.sources' -o -name 'sources.list' | xargs -r sudo sed -i \
                -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g'
              apt_update || true
            fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::could not install build dependencies after 4 attempts"; exit 1; }
          command -v aarch64-linux-gnu-gcc && command -v arm-linux-gnueabi-gcc

      - name: Restore Clang cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: clang
          key: aosp-clang-${{ env.CLANG_ID }}

      - name: Download AOSP Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          curl -fL --retry 5 --retry-delay 5 "$CLANG_URL" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz

      - name: Show toolchain and KernelSU Kconfig
        run: |
          echo "Variant: $VARIANT ($VARIANT_NAME)"
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/clang/bin/clang" --version | head -2
          ls -la drivers/kernelsu
          ls drivers/kernelsu/ >/dev/null && echo "drivers/kernelsu present"
          grep -rn "^config KSU" drivers/kernelsu/Kconfig || true
          # diagnostic only: grep exits 1 when nothing matches, which pipefail turns into a failed step
          grep -rIl "ksu_handle" fs kernel drivers/input 2>/dev/null | head || true
          echo "---- ksu_* names the kernel tree calls (outside the driver) ----"
          { grep -rhoE "ksu_[a-zA-Z0-9_]+" fs kernel drivers/input include 2>/dev/null | sort -u || true; } | head -60
          echo "---- ksu_handle_* names the driver provides ----"
          { grep -rhoE "ksu_handle_[a-zA-Z0-9_]+" drivers/kernelsu/ 2>/dev/null | sort -u || true; } | head -60

      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 "$DEFCONFIG"
          # Kernel name shown in Settings: Google ACK style, 4.14.357-g<hash>
          scripts/config --file out/.config --set-str LOCALVERSION "-g$(git rev-parse --short=12 HEAD)" -d LOCALVERSION_AUTO
          # Helper: read the real 'depends on' chain of a config symbol (default KSU, or NOMOUNT) from the
          # Kconfig files in this tree and switch it all on.
          cat > /tmp/ksu_deps.py <<'PY'
          import os, re, subprocess, sys

          target = sys.argv[1] if len(sys.argv) > 1 else "KSU"

          def read(p):
              try:
                  return open(p, errors="ignore").read()
              except Exception:
                  return ""

          BLOCK = re.compile(r"^(?:menu)?config\s+([A-Z0-9_]+)[ \t]*\n((?:[ \t]+.*\n|[ \t]*\n)*)", re.M)

          def parse(txt, blocks):
              for m in BLOCK.finditer(txt):
                  deps = [l.strip()[len("depends on"):].strip()
                          for l in m.group(2).splitlines() if l.strip().startswith("depends on")]
                  blocks.setdefault(m.group(1), []).extend(deps)

          blocks = {}
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in (".git", "out", "KernelSU", "Documentation")]
              for f in files:
                  if f.startswith("Kconfig"):
                      parse(read(os.path.join(root, f)), blocks)
          parse(read("drivers/kernelsu/Kconfig"), blocks)
          if target not in blocks:
              sys.exit("config %s not found in any Kconfig (is it sourced?)" % target)
          print("---- config %s: depends on %s ----" % (target, blocks[target] or "-"))

          def terms(expr):
              expr = re.sub(r"\s+if\s+.*$", "", expr)
              for t in expr.split("&&"):
                  t = t.strip().strip("()").strip()
                  if t and "||" not in t and "=" not in t:
                      yield t

          enable, disable, seen = [], [], set()

          def want(sym, depth=0):
              if sym in seen or depth > 6:
                  return
              seen.add(sym)
              enable.append(sym)
              for expr in blocks.get(sym, []):
                  for t in terms(expr):
                      neg = t.startswith("!")
                      s = t.lstrip("!").strip()
                      if not re.fullmatch(r"[A-Z0-9_]+", s):
                          continue
                      if neg:
                          disable.append(s)
                      else:
                          want(s, depth + 1)

          want(target)
          args = []
          for s in reversed(enable):          # dependencies first, target last
              args += ["-e", s]
          for s in disable:
              args += ["-d", s]
          print("deps: enable", " ".join(reversed(enable)), "| disable", " ".join(disable) or "-")
          subprocess.check_call(["scripts/config", "--file", "out/.config"] + args)
          PY
          # A different KernelSU version can bring new 'depends on' lines that make olddefconfig
          # drop CONFIG_KSU Resolve them from the Kconfig instead of failing.
          if ! grep -q "^CONFIG_KSU=y" out/.config; then
            echo "---- CONFIG_KSU is off after defconfig; resolving its dependencies ----"
            for round in 1 2; do
              python3 /tmp/ksu_deps.py KSU
              make O=out ARCH=arm64 olddefconfig
              grep -q "^CONFIG_KSU=y" out/.config && break
            done
            grep -E "^CONFIG_(KSU|KPROBES|MODULES|OVERLAY_FS)=" out/.config || true
          fi
          # BakaSU hook mode: manual hooks (the tracepoint hook is GKI 2.0 only). On kernels < 6.8 the
          # setuid / init.rc / input hooks are applied automatically via LSM / input handler, and
          # KALLSYMS_ALL spares us from un-static'ing the SELinux symbols BakaSU would otherwise check for.
          if [ "$ENABLE_SUSFS" != "true" ]; then
            scripts/config --file out/.config -e KSU -d KSU_TRACEPOINT_HOOK -e KSU_MANUAL_HOOK \
              -e KSU_MANUAL_HOOK_AUTO_SETUID_HOOK -e KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
              -e KSU_MANUAL_HOOK_AUTO_INPUT_HOOK -e KALLSYMS -e KALLSYMS_ALL
            make O=out ARCH=arm64 olddefconfig
            grep -E "^CONFIG_KSU|^CONFIG_KALLSYMS" out/.config || true
            grep -q "^CONFIG_KSU_MANUAL_HOOK=y" out/.config || { echo "::error::CONFIG_KSU_MANUAL_HOOK=y is not set in the final config (symbol missing from BakaSU Kconfig?)"; grep -nE "^[[:space:]]*(menu)?config |depends on" drivers/kernelsu/Kconfig | head -60; exit 1; }
          fi
          # NoMount (maxsteeel/nomount) was copied into fs/nomount by the previous steps
          scripts/config --file out/.config -e NOMOUNT
          make O=out ARCH=arm64 olddefconfig
          if ! grep -q "^CONFIG_NOMOUNT=y" out/.config; then
            echo "---- CONFIG_NOMOUNT is off; resolving its dependencies ----"
            python3 /tmp/ksu_deps.py NOMOUNT
            make O=out ARCH=arm64 olddefconfig
          fi
          grep -E "^CONFIG_NOMOUNT" out/.config || true
          grep -q "^CONFIG_NOMOUNT=y" out/.config || { echo "::error::CONFIG_NOMOUNT=y is not set in the final config"; sed -n '1,60p' fs/nomount/Kconfig 2>/dev/null || true; exit 1; }
          if [ "$ENABLE_SUSFS" = "true" ]; then
            # "SUSFS Inline Hook" is BakaSU's own hooking method: it replaces manual / tracepoint hook
            scripts/config --file out/.config -e KSU -d KSU_MANUAL_HOOK -d KSU_TRACEPOINT_HOOK -e KSU_SUSFS \
              -e KALLSYMS -e KALLSYMS_ALL
            make O=out ARCH=arm64 olddefconfig
            grep -E "^CONFIG_KSU|^CONFIG_KALLSYMS" out/.config || true
            grep -q "^CONFIG_KSU_SUSFS=y" out/.config || { echo "::error::CONFIG_KSU_SUSFS=y is not set in the final config (see the BakaSU Kconfig dump above)"; grep -nE "^[[:space:]]*(menu)?config |depends on" drivers/kernelsu/Kconfig | head -60; exit 1; }
          fi
          if [ "${{ inputs.disable_lto }}" = "true" ]; then
            scripts/config --file out/.config -d LTO_CLANG -d THINLTO -e LTO_NONE
            make O=out ARCH=arm64 olddefconfig
          fi
          grep -E "^CONFIG_KSU|^CONFIG_KPROBES|^CONFIG_MODULES=|^CONFIG_LTO|^CONFIG_THINLTO|^CONFIG_CFI|^CONFIG_LOCALVERSION=" out/.config || true
          grep -q "^CONFIG_KSU=y" out/.config || { echo "::error::CONFIG_KSU=y is not set in the final config"; exit 1; }

      - name: Build kernel
        run: |
          make -k -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            2>&1 | tee build.log

      - name: Show build errors
        if: failure() && hashFiles('build.log') != ''
        run: |
          grep -nE "error:|\*\*\*|undefined reference|ld.lld:" build.log | head -40 || true
          echo "---- last 30 lines ----"
          tail -30 build.log || true

      - name: Verify result
        id: verify
        run: |
          BOOT=out/arch/arm64/boot
          if [ -f "$BOOT/Image.gz-dtb" ]; then
            KIMG="$BOOT/Image.gz-dtb"
          elif [ -f "$BOOT/Image.gz" ]; then
            KIMG="$BOOT/Image.gz"
          else
            echo "::error::No Image.gz-dtb or Image.gz was produced"; ls -la "$BOOT"; exit 1
          fi
          echo "kimg=$KIMG" >> "$GITHUB_OUTPUT"
          KREL="$(cat out/include/config/kernel.release)"
          echo "krel=$KREL" >> "$GITHUB_OUTPUT"
          echo "Kernel release: $KREL"
          echo "Image: $KIMG"
          ls -la "$BOOT"
          # The root solution must really be compiled in
          COUNT="$(strings -n 8 out/arch/arm64/boot/Image | grep -ciE "KernelSU|FinaSU|BakaSU" || true)"
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "::error::No KernelSU/BakaSU strings found in the kernel image"; exit 1
          fi
          echo "KernelSU/BakaSU strings found in Image: $COUNT"
          NMC="$(strings -n 6 out/arch/arm64/boot/Image | grep -ci "nomount" || true)"
          if [ "${NMC:-0}" -eq 0 ]; then
            echo "::error::No NoMount strings found in the kernel image"; exit 1
          fi
          echo "NoMount strings found in Image: $NMC"
          if [ "$ENABLE_SUSFS" = "true" ]; then
            SUC="$(strings -n 6 out/arch/arm64/boot/Image | grep -ci "susfs" || true)"
            if [ "${SUC:-0}" -eq 0 ]; then
              echo "::error::No SUSFS strings found in the kernel image"; exit 1
            fi
            echo "SUSFS strings found in Image: $SUC"
          fi

      - name: Package AnyKernel3 zip
        id: pack
        run: |
          # Pinned: AnyKernel3 master on 2026-10-26/27 had a split_boot() bug ("Splitting image failed")
          AK3_SHA=c072981836cd3ee46ad52a5f2cba76ecb927cb1b
          git init -q AnyKernel3
          git -C AnyKernel3 fetch -q --depth=1 https://github.com/osm0sis/AnyKernel3 "$AK3_SHA"
          git -C AnyKernel3 checkout -q FETCH_HEAD
          rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/README.md \
                 AnyKernel3/modules AnyKernel3/patch AnyKernel3/ramdisk
          cat > AnyKernel3/anykernel.sh <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Spiteful-Sweet/KSU-r1.0 (@VARIANT_NAME@) for sweet by PsychoAvy
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=sweet
          device.name2=sweetin
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF
          sed -i "s|@VARIANT_NAME@|${VARIANT_NAME}|" AnyKernel3/anykernel.sh
          KIMG="${{ steps.verify.outputs.kimg }}"
          cp "$KIMG" "AnyKernel3/$(basename "$KIMG")"
          SHORT="$(git rev-parse --short HEAD)"
          ZIP="sweet-${SLUG}-${SHORT}-run${{ github.run_number }}.zip"
          (cd AnyKernel3 && zip -r9 "../$ZIP" . -x '.git*')
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          ls -la "$ZIP"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sweet-${SLUG}-run${{ github.run_number }}"
          if [ "${{ inputs.disable_lto }}" = "true" ]; then LTO="off"; else LTO="on"; fi
          {
            echo "### 🦉 Spiteful-Sweet"
            echo
            echo "\`${{ steps.verify.outputs.krel }}\`"
            echo
            echo "- 🔑 **Root:** ${VARIANT_NAME}"
            echo "- 📲 **Manager:** BakaSU manager (use a version matching this build)"
            echo "- 📁 **NoMount:** built in (install the NoMount module after flashing)"
            if [ "$ENABLE_SUSFS" = "true" ]; then
              echo "- 👻 **SUSFS:** built in (${SUSFS_DESC}). It hides nothing until configured: use the SUSFS screen of the BakaSU manager"
            fi
            echo "- ⚙️ **Clang ${CLANG_ID}** · LTO ${LTO}"
            echo "- 🔖 **Commit:** ${{ steps.pack.outputs.short }}"
            echo "- 🧬 **Base:** Spiteful kernel · [source](https://github.com/tbyool/android_kernel_xiaomi_sm6150)"
            echo
            echo "> Flash in recovery. Back up boot first."
          } > notes.txt
          ASSETS=("${{ steps.pack.outputs.zip }}")
          # GitHub's API occasionally answers HTTP 5xx; the build takes ~40 min, so retry instead of losing it.
          # If an earlier attempt already created the release, only (re)upload the assets.
          for i in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "${ASSETS[@]}" --clobber && { echo "release $TAG ready"; exit 0; }
            else
              gh release create "$TAG" "${ASSETS[@]}" \
                --title "Spiteful-Sweet" \
                --notes-file notes.txt && { echo "release $TAG created"; exit 0; }
            fi
            echo "release attempt $i failed; retrying in $((i*20))s"
            sleep $((i*20))
          done
          echo "::error::could not publish the GitHub release after 6 attempts"
          exit 1

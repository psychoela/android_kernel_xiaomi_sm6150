name: build

# Builds tbyool/android_kernel_xiaomi_sm6150 (branch ksu-next) for Redmi Note 10 Pro
# (sweet/sweetin) and publishes an AnyKernel3 zip as a GitHub Release. Nothing is
# uploaded as an Actions artifact (avoids the artifact storage quota problem).
#
# Root solution: backslashxx/KernelSU (manual-hook KernelSU fork that still supports old kernels),
# cloned at build time and wired in as drivers/kernelsu, plus NoMount (maxsteeel/nomount) integrated
# into the kernel source with its setup.sh. No SUSFS for now.
# The kernel tree's existing manual hooks (fs/exec.c, fs/open.c, ...) are used as they are;
# if the fork expects different hook names the build log will show it.
#
# Put this file at .github/workflows/build.yml in the ksu-next branch. Every push to
# ksu-next starts a build. The manual "Run workflow" button only shows up if the file is
# also on the repository's default branch (or ksu-next is set as the default branch).

on:
  push:
    branches: [ksu-next]
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "backslashxx/KernelSU ref: 'latest' = tip of its default branch, or type a tag/branch/commit"
        type: string
        default: latest
      nomount_ref:
        description: "maxsteeel/nomount branch used for the kernel side (master = stable, dev = nightly). Install the matching NoMount module after flashing."
        type: string
        default: master
      disable_lto:
        description: "Build WITHOUT LTO (faster; use to debug a failing/boot-looping build)"
        type: boolean
        default: false
      enable_susfs:
        description: "EXPERIMENTAL: add SUSFS (simonpunk/susfs4ksu, branch kernel-4.14) on top of KernelSU, together with NoMount"
        type: boolean
        default: true

permissions:
  contents: write

env:
  DEFCONFIG: sweet_defconfig
  ARCH: arm64
  # AOSP Clang 21.0.0 r563880c (same toolchain as the stock Spiteful kernel), pinned commit
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/f8439f0628d799092dd07df440a6334cab28939c/clang-r563880c.tar.gz
  CLANG_ID: r563880c
  KBUILD_BUILD_USER: PsychoAvy
  KBUILD_BUILD_HOST: github
  # SUSFS is on for push builds; for manual runs it follows the enable_susfs input
  ENABLE_SUSFS: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_susfs }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch KernelSU
        env:
          IN_KSU_REF: ${{ inputs.ksu_ref }}
        run: |
          set -e
          REF="${IN_KSU_REF:-latest}"
          if [ "$ENABLE_SUSFS" = "true" ]; then
            # SUSFS: the kernel-4.14 SUSFS patch is written against tiann/KernelSU from late May 2024
            # (non-GKI support still present). bd5100d6 is the closest commit (only 1 hunk needs porting).
            KSU_REPO="tiann/KernelSU"
            [ "$REF" = "latest" ] && REF="bd5100d6"
          else
            KSU_REPO="backslashxx/KernelSU"
          fi
          git clone --quiet "https://github.com/${KSU_REPO}" KernelSU
          echo "---- branches ----"
          git -C KernelSU branch -r | head -20
          if [ "$REF" != "latest" ]; then
            git -C KernelSU rev-parse -q --verify "${REF}^{commit}" >/dev/null || git -C KernelSU rev-parse -q --verify "origin/${REF}^{commit}" >/dev/null || { echo "::error::ref '$REF' not found in backslashxx/KernelSU (see the branch list above)"; exit 1; }
            git -C KernelSU checkout -q "$REF" 2>/dev/null || git -C KernelSU checkout -q "origin/$REF"
          fi
          SHORT="$(git -C KernelSU rev-parse --short HEAD)"
          DESC="$(git -C KernelSU describe --tags --always)"
          COUNT="$(git -C KernelSU rev-list --count HEAD)"
          echo "${KSU_REPO} @ $SHORT ($DESC), $COUNT commits"
          test -f KernelSU/kernel/Kconfig || { echo "::error::KernelSU/kernel/Kconfig not found"; ls -la KernelSU; exit 1; }
          # point drivers/kernelsu at the fork (the kernel tree already sources drivers/kernelsu)
          rm -rf drivers/kernelsu
          ln -s ../KernelSU/kernel drivers/kernelsu
          ls -la drivers/kernelsu
          echo "---- Kconfig of the fork (config names, dependencies, defaults) ----"
          grep -nE "^[[:space:]]*(menu)?config |depends on|default|select|prompt|bool|tristate" KernelSU/kernel/Kconfig | head -80
          if [ "$ENABLE_SUSFS" = "true" ]; then
            echo "VARIANT=susfs" >> "$GITHUB_ENV"
            echo "VARIANT_NAME=KernelSU ${SHORT} + SUSFS" >> "$GITHUB_ENV"
            echo "SLUG=susfs" >> "$GITHUB_ENV"
          else
            echo "VARIANT=xxksu" >> "$GITHUB_ENV"
            echo "VARIANT_NAME=backslashxx KernelSU ${DESC}" >> "$GITHUB_ENV"
            echo "SLUG=xxksu" >> "$GITHUB_ENV"
          fi
          echo "KSU_DESC=${KSU_REPO} @ ${SHORT} (${DESC})" >> "$GITHUB_ENV"

      - name: Integrate NoMount into the kernel
        env:
          IN_NM_REF: ${{ inputs.nomount_ref }}
        run: |
          set -e
          NM_REF="${IN_NM_REF:-master}"
          curl -fsSL "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/${NM_REF}/kernel/setup.sh" -o /tmp/nm_setup.sh \
            || { echo "::error::could not download kernel/setup.sh from branch '${NM_REF}' of maxsteeel/nomount"; exit 1; }
          echo "---- setup.sh (first 60 lines) ----"
          head -60 /tmp/nm_setup.sh
          echo "---- running it at the kernel tree root ----"
          bash /tmp/nm_setup.sh "$NM_REF"
          test -d fs/nomount || { echo "::error::fs/nomount was not created by setup.sh"; git status --short | head -30; exit 1; }
          ls -la fs/nomount
          grep -n "nomount" fs/Kconfig fs/Makefile || true
          echo "---- fs/nomount/Kconfig ----"
          cat fs/nomount/Kconfig 2>/dev/null | head -40 || true
          echo "NM_DESC=maxsteeel/nomount branch ${NM_REF}" >> "$GITHUB_ENV"

      # The kernel tree was prepared for KernelSU-Next (legacy). backslashxx/KernelSU uses the
      # "scope-minimized manual hooks" layout (backslashxx/KernelSU#5), which differs in two places:
      #  1. fs/read_write.c still calls ksu_vfs_read_hook / ksu_handle_sys_read, which the fork does not
      #     provide (init.rc is handled through an LSM hook instead). Define them as inert stubs so the
      #     link succeeds; the flag stays false, so the old read hook never runs.
      #  2. fs/stat.c needs the newfstat return hook, otherwise init never sees the enlarged init.rc
      #     (required on Android 16+, harmless on older).
      - name: Adapt manual hooks for backslashxx/KernelSU
        if: env.ENABLE_SUSFS != 'true'
        run: |
          set -e
          cat > fs/ksu_hook_stubs.c <<'EOF'
          // SPDX-License-Identifier: GPL-2.0
          /* Inert stubs for the old KernelSU-Next read hook still referenced by fs/read_write.c. */
          #include <linux/types.h>
          #include <linux/compiler.h>
          #include <linux/cache.h>
          #include <linux/uaccess.h>

          bool ksu_vfs_read_hook __read_mostly = false;

          int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr)
          {
          	return 0;
          }
          EOF
          grep -q "ksu_hook_stubs" fs/Makefile || echo 'obj-$(CONFIG_KSU) += ksu_hook_stubs.o' >> fs/Makefile
          python3 - <<'PY'
          import re, sys, pathlib
          p = pathlib.Path("fs/stat.c")
          text = p.read_text()
          if "ksu_handle_newfstat_ret" in text:
              print("fs/stat.c: newfstat hook already present")
              sys.exit(0)
          m = re.search(r"^SYSCALL_DEFINE2\(newfstat,.*?^\}\n", text, re.S | re.M)
          if not m:
              sys.exit("SYSCALL_DEFINE2(newfstat) not found in fs/stat.c")
          body = m.group(0)
          if "\treturn error;\n}" not in body:
              sys.exit("unexpected newfstat body:\n" + body)
          new = body.replace("\treturn error;\n}",
              "#if defined(CONFIG_KSU) && !defined(CONFIG_KSU_KPROBES_KSUD)\n\tksu_handle_newfstat_ret(&fd, &statbuf);\n#endif\n\treturn error;\n}", 1)
          decl = ("#if defined(CONFIG_KSU) && !defined(CONFIG_KSU_KPROBES_KSUD)\n"
                  "extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n"
                  "#endif\n\n")
          p.write_text(text[:m.start()] + decl + new + text[m.end():])
          print("fs/stat.c: newfstat hook added")
          PY
          git --no-pager diff --stat -- fs/stat.c fs/Makefile || true
          grep -n -B3 -A3 "ksu_handle_newfstat_ret" fs/stat.c | head -30

      # EXPERIMENTAL. SUSFS kernel-4.14 patches (simonpunk/susfs4ksu, pinned) + tiann/KernelSU @ bd5100d6.
      # Known gaps handled here: one KernelSU hunk (selinux.c) and three optional kernel hunks
      # (task_mmu.c include, sys.c uname spoof, cmdline.c spoof) are ported by small scripts.
      # Anything else that fails stops the build and prints the rejected hunks.
      - name: Integrate SUSFS (experimental)
        if: env.ENABLE_SUSFS == 'true'
        run: |
          set -e
          rm -rf /tmp/susfs
          git clone --quiet -b kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu /tmp/susfs \
            || git clone --quiet -b kernel-4.14 https://github.com/kutemeikito/susfs4ksu /tmp/susfs
          git -C /tmp/susfs checkout -q 77905b5 || echo "::warning::pinned SUSFS commit 77905b5 not found, using branch tip"
          echo "SUSFS @ $(git -C /tmp/susfs rev-parse --short HEAD)"
          P=/tmp/susfs/kernel_patches
          KPATCH="$P/50_add_susfs_in_kernel-4.14.patch"
          SPATCH="$P/KernelSU/10_enable_susfs_for_ksu.patch"
          test -f "$KPATCH" || { echo "::error::$KPATCH not found"; exit 1; }
          test -f "$SPATCH" || { echo "::error::$SPATCH not found"; exit 1; }
          cp -v "$P"/fs/*.c fs/
          cp -v "$P"/include/linux/*.h include/linux/

          echo "---- 1/3: KernelSU side patch ----"
          ( cd KernelSU && patch -p1 --batch --no-backup-if-mismatch < "$SPATCH" ) || true
          cat > /tmp/ksu_fix.py <<'PY'
          import pathlib, re, sys
          # Port the SUSFS hunks that do not apply to backslashxx-free tiann KernelSU: selinux.c.rej
          rej = pathlib.Path("KernelSU/kernel/selinux/selinux.c.rej")
          if rej.exists():
              txt = rej.read_text()
              add = [l[1:] for l in txt.splitlines() if l.startswith("+") and not l.startswith("+++")]
              if not add or "susfs_set_sid" not in "\n".join(add):
                  sys.exit("selinux.c.rej does not look like the expected SUSFS hunk")
              p = pathlib.Path("KernelSU/kernel/selinux/selinux.c")
              t = p.read_text()
              if "susfs_set_sid" not in t:
                  anchor = "#define DEVPTS_DOMAIN"
                  i = t.find(anchor)
                  if i < 0:
                      sys.exit("anchor '#define DEVPTS_DOMAIN' not found in selinux.c")
                  t = t[:i] + "\n".join(add) + "\n" + t[i:]
                  p.write_text(t)
              rej.unlink()
              print("selinux.c: ported the rejected SUSFS hunk")
          PY

          python3 -I /tmp/ksu_fix.py
          if [ -n "$(find KernelSU -name '*.rej')" ]; then
            echo "::error::SUSFS KernelSU-side patch has unported rejected hunks"
            for f in $(find KernelSU -name '*.rej'); do echo "=== $f ==="; cat "$f"; done
            exit 1
          fi

          echo "---- 2/3: kernel side patch ----"
          patch -p1 --batch --no-backup-if-mismatch < "$KPATCH" || true
          cat > /tmp/kernel_fix.py <<'PY'
          import pathlib, re, sys

          def rd(p): return pathlib.Path(p).read_text()
          def wr(p, t): pathlib.Path(p).write_text(t)

          # fs/proc/task_mmu.c: include susfs_def.h (needed by the hunks that did apply)
          p = "fs/proc/task_mmu.c"; t = rd(p)
          if "susfs_def.h" not in t:
              a = "#include <linux/uaccess.h>\n"
              if a not in t: sys.exit("task_mmu.c: anchor not found")
              wr(p, t.replace(a, a + "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif\n", 1))
              print("task_mmu.c: include added")

          # kernel/sys.c: uname spoof hook
          p = "kernel/sys.c"; t = rd(p)
          if "susfs_spoof_uname" not in t:
              a = "SYSCALL_DEFINE1(newuname, struct new_utsname __user *, name)\n{"
              if a not in t: sys.exit("sys.c: newuname not found")
              t = t.replace(a, "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\nextern void susfs_spoof_uname(struct new_utsname* tmp);\n#endif\n" + a, 1)
              m = re.search(r"SYSCALL_DEFINE1\(newuname.*?memcpy\(&tmp, utsname\(\), sizeof\(tmp\)\);\n", t, re.S)
              if not m: sys.exit("sys.c: memcpy in newuname not found")
              t = t[:m.end()] + "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n\tsusfs_spoof_uname(&tmp);\n#endif\n" + t[m.end():]
              wr(p, t)
              print("sys.c: uname spoof hook added")

          # fs/proc/cmdline.c: cmdline spoof hook
          p = "fs/proc/cmdline.c"; t = rd(p)
          if "susfs_spoof_cmdline_or_bootconfig" not in t:
              a = "static int cmdline_proc_show(struct seq_file *m, void *v)\n{\n"
              if a not in t: sys.exit("cmdline.c: cmdline_proc_show not found")
              t = t.replace(a,
                  "#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\nextern int susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);\n#endif\n\n" + a +
                  "#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n\tif (!susfs_spoof_cmdline_or_bootconfig(m)) {\n\t\tseq_putc(m, '\\n');\n\t\treturn 0;\n\t}\n#endif\n", 1)
              wr(p, t)
              print("cmdline.c: cmdline spoof hook added")
          PY

          python3 -I /tmp/kernel_fix.py
          # these three .rej files were ported by kernel_fix.py above; anything else is a real failure
          rm -f fs/proc/task_mmu.c.rej kernel/sys.c.rej fs/proc/cmdline.c.rej
          if [ -n "$(find . -name '*.rej' -not -path './out/*' -not -path './KernelSU/*')" ]; then
            echo "::error::SUSFS kernel patch has failing hunks"
            for f in $(find . -name '*.rej' -not -path './out/*' -not -path './KernelSU/*'); do echo "=== $f ==="; cat "$f"; done
            exit 1
          fi

          echo "---- 3/3: hook stubs ----"
          # kernel/reboot.c calls ksu_handle_sys_reboot; this KernelSU version does not provide it
          if ! grep -rq "ksu_handle_sys_reboot" KernelSU/kernel; then
            cat > fs/ksu_susfs_stubs.c <<'EOF'
          // SPDX-License-Identifier: GPL-2.0
          #include <linux/types.h>
          #include <linux/compiler.h>

          int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg)
          {
          	return 0;
          }
          EOF
            grep -q "ksu_susfs_stubs" fs/Makefile || echo 'obj-$(CONFIG_KSU) += ksu_susfs_stubs.o' >> fs/Makefile
            echo "added ksu_handle_sys_reboot stub"
          fi
          git --no-pager diff --stat | tail -30 || true
          echo "SUSFS_DESC=simonpunk/susfs4ksu kernel-4.14 @ $(git -C /tmp/susfs rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio zip unzip lz4 xz-utils \
            python3 device-tree-compiler make gcc \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Restore Clang cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: clang
          key: aosp-clang-${{ env.CLANG_ID }}

      - name: Download AOSP Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          curl -fL --retry 5 --retry-delay 5 "$CLANG_URL" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz

      - name: Show toolchain and KernelSU Kconfig
        run: |
          echo "Variant: $VARIANT ($VARIANT_NAME)"
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/clang/bin/clang" --version | head -2
          ls -la drivers/kernelsu
          ls drivers/kernelsu/ >/dev/null && echo "drivers/kernelsu present"
          grep -rn "^config KSU" drivers/kernelsu/Kconfig || true
          # diagnostic only: grep exits 1 when nothing matches, which pipefail turns into a failed step
          grep -rIl "ksu_handle" fs kernel drivers/input 2>/dev/null | head || true
          echo "---- ksu_* names the kernel tree calls (outside the driver) ----"
          { grep -rhoE "ksu_[a-zA-Z0-9_]+" fs kernel drivers/input include 2>/dev/null | sort -u || true; } | head -60
          echo "---- ksu_handle_* names the driver provides ----"
          { grep -rhoE "ksu_handle_[a-zA-Z0-9_]+" drivers/kernelsu/ 2>/dev/null | sort -u || true; } | head -60

      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 "$DEFCONFIG"
          # Kernel name shown in Settings / KernelSU: 4.14.357-Spiteful-Sweet/KSU-r1.0
          scripts/config --file out/.config --set-str LOCALVERSION "-Spiteful-Sweet/KSU-r1.0" -d LOCALVERSION_AUTO
          # Helper: read the real 'depends on' chain of a config symbol (default KSU, or NOMOUNT) from the
          # Kconfig files in this tree and switch it all on.
          cat > /tmp/ksu_deps.py <<'PY'
          import os, re, subprocess, sys

          target = sys.argv[1] if len(sys.argv) > 1 else "KSU"

          def read(p):
              try:
                  return open(p, errors="ignore").read()
              except Exception:
                  return ""

          BLOCK = re.compile(r"^(?:menu)?config\s+([A-Z0-9_]+)[ \t]*\n((?:[ \t]+.*\n|[ \t]*\n)*)", re.M)

          def parse(txt, blocks):
              for m in BLOCK.finditer(txt):
                  deps = [l.strip()[len("depends on"):].strip()
                          for l in m.group(2).splitlines() if l.strip().startswith("depends on")]
                  blocks.setdefault(m.group(1), []).extend(deps)

          blocks = {}
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in (".git", "out", "KernelSU", "Documentation")]
              for f in files:
                  if f.startswith("Kconfig"):
                      parse(read(os.path.join(root, f)), blocks)
          parse(read("drivers/kernelsu/Kconfig"), blocks)
          if target not in blocks:
              sys.exit("config %s not found in any Kconfig (is it sourced?)" % target)
          print("---- config %s: depends on %s ----" % (target, blocks[target] or "-"))

          def terms(expr):
              expr = re.sub(r"\s+if\s+.*$", "", expr)
              for t in expr.split("&&"):
                  t = t.strip().strip("()").strip()
                  if t and "||" not in t and "=" not in t:
                      yield t

          enable, disable, seen = [], [], set()

          def want(sym, depth=0):
              if sym in seen or depth > 6:
                  return
              seen.add(sym)
              enable.append(sym)
              for expr in blocks.get(sym, []):
                  for t in terms(expr):
                      neg = t.startswith("!")
                      s = t.lstrip("!").strip()
                      if not re.fullmatch(r"[A-Z0-9_]+", s):
                          continue
                      if neg:
                          disable.append(s)
                      else:
                          want(s, depth + 1)

          want(target)
          args = []
          for s in reversed(enable):          # dependencies first, target last
              args += ["-e", s]
          for s in disable:
              args += ["-d", s]
          print("deps: enable", " ".join(reversed(enable)), "| disable", " ".join(disable) or "-")
          subprocess.check_call(["scripts/config", "--file", "out/.config"] + args)
          PY
          # A different KernelSU version can bring new 'depends on' lines that make olddefconfig
          # drop CONFIG_KSU Resolve them from the Kconfig instead of failing.
          if ! grep -q "^CONFIG_KSU=y" out/.config; then
            echo "---- CONFIG_KSU is off after defconfig; resolving its dependencies ----"
            for round in 1 2; do
              python3 /tmp/ksu_deps.py KSU
              make O=out ARCH=arm64 olddefconfig
              grep -q "^CONFIG_KSU=y" out/.config && break
            done
            grep -E "^CONFIG_(KSU|KPROBES|MODULES|OVERLAY_FS)=" out/.config || true
          fi
          # NoMount (maxsteeel/nomount) was copied into fs/nomount by the previous steps
          scripts/config --file out/.config -e NOMOUNT
          make O=out ARCH=arm64 olddefconfig
          if ! grep -q "^CONFIG_NOMOUNT=y" out/.config; then
            echo "---- CONFIG_NOMOUNT is off; resolving its dependencies ----"
            python3 /tmp/ksu_deps.py NOMOUNT
            make O=out ARCH=arm64 olddefconfig
          fi
          grep -E "^CONFIG_NOMOUNT" out/.config || true
          grep -q "^CONFIG_NOMOUNT=y" out/.config || { echo "::error::CONFIG_NOMOUNT=y is not set in the final config"; sed -n '1,60p' fs/nomount/Kconfig 2>/dev/null || true; exit 1; }
          if [ "$ENABLE_SUSFS" = "true" ]; then
            scripts/config --file out/.config -e KSU_SUSFS
            make O=out ARCH=arm64 olddefconfig
            grep -E "^CONFIG_KSU_SUSFS" out/.config || true
            grep -q "^CONFIG_KSU_SUSFS=y" out/.config || { echo "::error::CONFIG_KSU_SUSFS=y is not set in the final config (symbol missing from KernelSU Kconfig?)"; exit 1; }
          fi
          if [ "${{ inputs.disable_lto }}" = "true" ]; then
            scripts/config --file out/.config -d LTO_CLANG -d THINLTO -e LTO_NONE
            make O=out ARCH=arm64 olddefconfig
          fi
          grep -E "^CONFIG_KSU|^CONFIG_KPROBES|^CONFIG_MODULES=|^CONFIG_LTO|^CONFIG_THINLTO|^CONFIG_CFI|^CONFIG_LOCALVERSION=" out/.config || true
          grep -q "^CONFIG_KSU=y" out/.config || { echo "::error::CONFIG_KSU=y is not set in the final config"; exit 1; }

      - name: Build kernel
        run: |
          make -k -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            2>&1 | tee build.log

      - name: Show build errors
        if: failure() && hashFiles('build.log') != ''
        run: |
          grep -nE "error:|\*\*\*|undefined reference|ld.lld:" build.log | head -40 || true
          echo "---- last 30 lines ----"
          tail -30 build.log || true

      - name: Verify result
        id: verify
        run: |
          BOOT=out/arch/arm64/boot
          if [ -f "$BOOT/Image.gz-dtb" ]; then
            KIMG="$BOOT/Image.gz-dtb"
          elif [ -f "$BOOT/Image.gz" ]; then
            KIMG="$BOOT/Image.gz"
          else
            echo "::error::No Image.gz-dtb or Image.gz was produced"; ls -la "$BOOT"; exit 1
          fi
          echo "kimg=$KIMG" >> "$GITHUB_OUTPUT"
          KREL="$(cat out/include/config/kernel.release)"
          echo "krel=$KREL" >> "$GITHUB_OUTPUT"
          echo "Kernel release: $KREL"
          echo "Image: $KIMG"
          ls -la "$BOOT"
          # The root solution must really be compiled in
          COUNT="$(strings -n 8 out/arch/arm64/boot/Image | grep -ciE "KernelSU|FinaSU" || true)"
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "::error::No KernelSU/FinaSU strings found in the kernel image"; exit 1
          fi
          echo "KernelSU/FinaSU strings found in Image: $COUNT"
          NMC="$(strings -n 6 out/arch/arm64/boot/Image | grep -ci "nomount" || true)"
          if [ "${NMC:-0}" -eq 0 ]; then
            echo "::error::No NoMount strings found in the kernel image"; exit 1
          fi
          echo "NoMount strings found in Image: $NMC"
          if [ "$ENABLE_SUSFS" = "true" ]; then
            SUC="$(strings -n 6 out/arch/arm64/boot/Image | grep -ci "susfs" || true)"
            if [ "${SUC:-0}" -eq 0 ]; then
              echo "::error::No SUSFS strings found in the kernel image"; exit 1
            fi
            echo "SUSFS strings found in Image: $SUC"
          fi

      - name: Package AnyKernel3 zip
        id: pack
        run: |
          # Pinned: AnyKernel3 master on 2026-10-26/27 had a split_boot() bug ("Splitting image failed")
          AK3_SHA=c072981836cd3ee46ad52a5f2cba76ecb927cb1b
          git init -q AnyKernel3
          git -C AnyKernel3 fetch -q --depth=1 https://github.com/osm0sis/AnyKernel3 "$AK3_SHA"
          git -C AnyKernel3 checkout -q FETCH_HEAD
          rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/README.md \
                 AnyKernel3/modules AnyKernel3/patch AnyKernel3/ramdisk
          cat > AnyKernel3/anykernel.sh <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Spiteful-Sweet/KSU-r1.0 (@VARIANT_NAME@) for sweet by PsychoAvy
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=sweet
          device.name2=sweetin
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF
          sed -i "s|@VARIANT_NAME@|${VARIANT_NAME}|" AnyKernel3/anykernel.sh
          KIMG="${{ steps.verify.outputs.kimg }}"
          cp "$KIMG" "AnyKernel3/$(basename "$KIMG")"
          SHORT="$(git rev-parse --short HEAD)"
          ZIP="sweet-${SLUG}-${SHORT}-run${{ github.run_number }}.zip"
          (cd AnyKernel3 && zip -r9 "../$ZIP" . -x '.git*')
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          ls -la "$ZIP"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sweet-${SLUG}-run${{ github.run_number }}"
          if [ "${{ inputs.disable_lto }}" = "true" ]; then LTO="off"; else LTO="on"; fi
          {
            echo "### 🦉 Spiteful-Sweet/KSU-r1.0"
            echo
            echo "\`${{ steps.verify.outputs.krel }}\`"
            echo
            echo "- 🔑 **Root:** ${VARIANT_NAME}"
            echo "- 📁 **NoMount:** built in (install the NoMount module after flashing)"
            if [ "$ENABLE_SUSFS" = "true" ]; then
              echo "- 👻 **SUSFS:** built in (install the SUSFS module after flashing)"
            fi
            echo "- ⚙️ **Clang ${CLANG_ID}** · LTO ${LTO}"
            echo "- 🔖 **Commit:** ${{ steps.pack.outputs.short }}"
            echo "- 🧬 **Base:** Spiteful kernel (stock DerpFest kernel) · [source](https://github.com/tbyool/android_kernel_xiaomi_sm6150)"
            echo
            echo "> Flash in recovery. Back up boot first."
          } > notes.txt
          gh release create "$TAG" "${{ steps.pack.outputs.zip }}" \
            --title "Spiteful-Sweet r1.0 · run ${{ github.run_number }}" \
            --notes-file notes.txt

name: build

# Builds tbyool/android_kernel_xiaomi_sm6150 (branch ksu-next, KernelSU Next legacy +
# manual hooks) for Redmi Note 10 Pro (sweet/sweetin) and publishes an AnyKernel3 zip
# as a GitHub Release. Nothing is uploaded as an Actions artifact (avoids the artifact
# storage quota problem).
#
# Put this file at .github/workflows/build.yml in the ksu-next branch. Every push to
# ksu-next starts a build. The manual "Run workflow" button only shows up if the file is
# also on the repository's default branch (or ksu-next is set as the default branch).

on:
  push:
    branches: [ksu-next]
  workflow_dispatch:
    inputs:
      disable_lto:
        description: "Build WITHOUT LTO (faster; use to debug a failing/boot-looping build)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  DEFCONFIG: sweet_defconfig
  ARCH: arm64
  # AOSP Clang 21.0.0 r563880c (same toolchain as the stock Spiteful kernel), pinned commit
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/f8439f0628d799092dd07df440a6334cab28939c/clang-r563880c.tar.gz
  CLANG_ID: r563880c
  # KernelSU-Next "legacy" branch @165b87f (v3.4.0-legacy + fixes), ksuver = 30000 + 3027 commits + 289
  KSU_VERSION: "33316"
  KSU_TAG: "v3.4.0-legacy"
  # susfs4ksu branch for kernel 4.14 (branch head = susfs 1.5.5; the module needs v1.5.3+)
  SUSFS_REF: kernel-4.14
  KBUILD_BUILD_USER: PsychoAvy
  KBUILD_BUILD_HOST: github

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio zip unzip lz4 xz-utils \
            python3 device-tree-compiler make gcc \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Restore Clang cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: clang
          key: aosp-clang-${{ env.CLANG_ID }}

      - name: Download AOSP Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          curl -fL --retry 5 --retry-delay 5 "$CLANG_URL" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz

      - name: Show toolchain and KernelSU Kconfig
        run: |
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/clang/bin/clang" --version | head -2
          ls drivers/kernelsu >/dev/null && echo "drivers/kernelsu present"
          grep -rn "^config KSU" KernelSU-Next/kernel/Kconfig || true
          grep -rIl "ksu_handle" fs kernel drivers/input 2>/dev/null | head

      - name: Add SUSFS (susfs4ksu ${{ env.SUSFS_REF }})
        run: |
          set -e
          git clone --depth=1 -b "$SUSFS_REF" https://gitlab.com/simonpunk/susfs4ksu.git "$RUNNER_TEMP/susfs4ksu"
          SP="$RUNNER_TEMP/susfs4ksu/kernel_patches"
          ls -R "$SP" | head -30
          # new SUSFS source files
          cp "$SP"/fs/* fs/
          cp "$SP"/include/linux/* include/linux/
          # kernel-side patch
          patch -p1 -F3 --no-backup-if-mismatch < "$SP/50_add_susfs_in_kernel-4.14.patch" || FAIL=1
          # KernelSU-Next side patch: try the KernelSU-Next specific SUSFS patch first
          # (sidex15, susfs 1.5.3), then fall back to simonpunk's generic one
          KSUN_OK=0
          if curl -fsSL -o "$RUNNER_TEMP/ksun-susfs.patch" https://github.com/sidex15/KernelSU-Next/commit/1e750de25930e875612bbec0410de0088474c00b.patch; then
            if (cd KernelSU-Next && patch -p1 -F3 --dry-run < "$RUNNER_TEMP/ksun-susfs.patch" >/dev/null); then
              (cd KernelSU-Next && patch -p1 -F3 --no-backup-if-mismatch < "$RUNNER_TEMP/ksun-susfs.patch") && KSUN_OK=1
              echo "Applied sidex15 KernelSU-Next SUSFS patch"
            else
              echo "sidex15 patch does not apply cleanly, trying generic patch"
            fi
          fi
          if [ "$KSUN_OK" = "0" ]; then
            cp "$SP/KernelSU/10_enable_susfs_for_ksu.patch" KernelSU-Next/
            (cd KernelSU-Next && patch -p1 -F3 --no-backup-if-mismatch < 10_enable_susfs_for_ksu.patch) || FAIL=1
          fi
          if [ "${FAIL:-0}" = "1" ]; then
            echo "::error::SUSFS patch had failed hunks, see .rej files below"
            find . -name "*.rej" -not -path "./out/*" -print -exec cat {} \;
            exit 1
          fi
          grep -n "config KSU_SUSFS" KernelSU-Next/kernel/Kconfig | head -20

      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 "$DEFCONFIG"
          # SUSFS: manual hooks are used, so SUS_SU (kprobe-based) stays off
          scripts/config --file out/.config -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_SUS_OVERLAYFS \
            -e KSU_SUSFS_TRY_UMOUNT -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_OPEN_REDIRECT \
            -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e KSU_SUSFS_SPOOF_BOOTCONFIG \
            -d KSU_SUSFS_SUS_SU
          make O=out ARCH=arm64 olddefconfig
          grep -q "^CONFIG_KSU_SUSFS=y" out/.config || { echo "::error::CONFIG_KSU_SUSFS=y is not set in the final config"; exit 1; }
          if [ "${{ inputs.disable_lto }}" = "true" ]; then
            scripts/config --file out/.config -d LTO_CLANG -d THINLTO -e LTO_NONE
            make O=out ARCH=arm64 olddefconfig
          fi
          grep -E "^CONFIG_KSU|^CONFIG_KPROBES|^CONFIG_LTO|^CONFIG_THINLTO|^CONFIG_CFI|^CONFIG_LOCALVERSION=" out/.config || true
          grep -q "^CONFIG_KSU=y" out/.config || { echo "::error::CONFIG_KSU=y is not set in the final config"; exit 1; }

      - name: Build kernel
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KSU_VERSION_OVERRIDE="${KSU_VERSION}" \
            KSU_VERSION_TAG_OVERRIDE="${KSU_TAG}" \
            2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          grep -nE "error:|\*\*\*|undefined reference|ld.lld:" build.log | head -40 || true
          echo "---- last 30 lines ----"
          tail -30 build.log || true

      - name: Verify result
        id: verify
        run: |
          BOOT=out/arch/arm64/boot
          if [ -f "$BOOT/Image.gz-dtb" ]; then
            KIMG="$BOOT/Image.gz-dtb"
          elif [ -f "$BOOT/Image.gz" ]; then
            KIMG="$BOOT/Image.gz"
          else
            echo "::error::No Image.gz-dtb or Image.gz was produced"; ls -la "$BOOT"; exit 1
          fi
          echo "kimg=$KIMG" >> "$GITHUB_OUTPUT"
          KREL="$(cat out/include/config/kernel.release)"
          echo "krel=$KREL" >> "$GITHUB_OUTPUT"
          echo "Kernel release: $KREL"
          echo "Image: $KIMG"
          ls -la "$BOOT"
          # KernelSU must really be compiled in
          COUNT="$(strings -n 8 out/arch/arm64/boot/Image | grep -c "KernelSU" || true)"
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "::error::No KernelSU strings found in the kernel image"; exit 1
          fi
          echo "KernelSU strings found in Image: $COUNT"
          SUSFS_COUNT="$(strings -n 6 out/arch/arm64/boot/Image | grep -ci "susfs" || true)"
          if [ "${SUSFS_COUNT:-0}" -eq 0 ]; then
            echo "::error::No SUSFS strings found in the kernel image"; exit 1
          fi
          echo "SUSFS strings found in Image: $SUSFS_COUNT"

      - name: Package AnyKernel3 zip
        id: pack
        run: |
          # Pinned: AnyKernel3 master on 2026-10-26/27 had a split_boot() bug ("Splitting image failed")
          AK3_SHA=c072981836cd3ee46ad52a5f2cba76ecb927cb1b
          git init -q AnyKernel3
          git -C AnyKernel3 fetch -q --depth=1 https://github.com/osm0sis/AnyKernel3 "$AK3_SHA"
          git -C AnyKernel3 checkout -q FETCH_HEAD
          rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/README.md \
                 AnyKernel3/modules AnyKernel3/patch AnyKernel3/ramdisk
          cat > AnyKernel3/anykernel.sh <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Spiteful (KernelSU Next + SUSFS) for sweet by PsychoAvy
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=sweet
          device.name2=sweetin
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF
          KIMG="${{ steps.verify.outputs.kimg }}"
          cp "$KIMG" "AnyKernel3/$(basename "$KIMG")"
          SHORT="$(git rev-parse --short HEAD)"
          ZIP="sweet-ksun-${SHORT}-run${{ github.run_number }}.zip"
          (cd AnyKernel3 && zip -r9 "../$ZIP" . -x '.git*')
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          ls -la "$ZIP"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sweet-ksun-run${{ github.run_number }}"
          {
            echo "Kernel: ${{ steps.verify.outputs.krel }}"
            echo "Source: ${{ github.repository }}@${{ steps.pack.outputs.short }} (branch ${{ github.ref_name }})"
            echo "Root: KernelSU Next (legacy, manual hooks) + SUSFS (susfs4ksu ${SUSFS_REF})"
            echo "Toolchain: AOSP Clang ${CLANG_ID}"
            echo "LTO disabled: ${{ inputs.disable_lto }}"
            echo
            echo "Flash in recovery. Back up boot first."
          } > notes.txt
          gh release create "$TAG" "${{ steps.pack.outputs.zip }}" \
            --title "sweet KSUN ${{ steps.pack.outputs.short }} (run ${{ github.run_number }})" \
            --notes-file notes.txt
